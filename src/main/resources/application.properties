# Configuração do banco H2
spring.datasource.url=jdbc:h2:mem:gasdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Mostra o SQL no console para você debugar o que o Hibernate está fazendo
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# O Hibernate vai criar as tabelas automaticamente com base nas nossas classes
spring.jpa.hibernate.ddl-auto=update

# Flyway desligado no perfil de desenvolvimento (banco H2 em memória, efêmero).
# As migrações versionadas rodam no perfil "docker" (Postgres real).
spring.flyway.enabled=false

# Habilita a interface visual do H2 no navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


# Preços do gás P13 (comum): à vista x cartão de crédito (parcelável)
app.preco.p13=150.00
app.preco.p13.credito=155.00

# Evolution API (WhatsApp) — configurável via variáveis de ambiente
evolution.api.url=${EVOLUTION_API_URL:http://localhost:8090/message/sendText/botgas}
evolution.api.key=${EVOLUTION_API_KEY:}

# Resiliência da integração: timeouts curtos + retry com backoff exponencial.
evolution.api.timeout-conexao-ms=${EVOLUTION_TIMEOUT_CONEXAO_MS:3000}
evolution.api.timeout-leitura-ms=${EVOLUTION_TIMEOUT_LEITURA_MS:8000}
evolution.api.max-tentativas=${EVOLUTION_MAX_TENTATIVAS:3}
evolution.api.espera-base-ms=${EVOLUTION_ESPERA_BASE_MS:700}

# ===================== SEGURANÇA =====================
# APP_AMBIENTE=producao liga a validação estrita: a aplicação se RECUSA a subir
# com senha padrão/fraca, chave do robô ausente ou CORS só de localhost.
app.seguranca.ambiente=${APP_AMBIENTE:desenvolvimento}

# Credenciais do painel (HTTP Basic). Perfil de desenvolvimento: conveniência.
app.seguranca.admin-usuario=${APP_ADMIN_USUARIO:admin}
app.seguranca.admin-senha=${APP_ADMIN_SENHA:binho-admin}

# Chave que o Typebot envia no header X-Api-Key ao criar pedidos.
# Vazio = endpoint aberto (somente desenvolvimento local).
app.seguranca.bot-api-key=${BOT_API_KEY:}

# Origens liberadas no CORS (separadas por vírgula).
app.seguranca.origens-permitidas=${APP_CORS_ORIGINS:http://localhost:5173,http://localhost:8080}

# Robustez na integração com o Typebot: string vazia ("") vira null em campos
# não-textuais (BigDecimal, enums) em vez de quebrar a desserialização.
spring.jackson.deserialization.accept-empty-string-as-null-object=true