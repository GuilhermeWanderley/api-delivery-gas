# Profile "docker" — usado pelo docker-compose
spring.datasource.url=jdbc:postgresql://${DB_HOST:db}:5432/${DB_NAME:gasdelivery}
spring.datasource.username=${DB_USER:gas}
spring.datasource.password=${DB_PASSWORD:gas}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
# O dialeto é detectado automaticamente (não precisa declarar).

# ===================== MIGRAÇÕES (FLYWAY) =====================
# O schema passa a ser versionado por migrações em db/migration.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Banco já existente é marcado como baseline 1 (a V1 descreve o schema atual);
# a partir daí, só as migrações novas (V2, V3...) são aplicadas.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# O Hibernate apenas confere se as entidades batem com o schema do banco.
spring.jpa.hibernate.ddl-auto=validate

# Boas práticas em produção
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# H2 console desativado no modo docker
spring.h2.console.enabled=false

# ===================== SEGURANÇA =====================
# Este é o perfil "real" (Postgres). Nada de senha padrão aqui:
# se APP_ADMIN_SENHA não vier do .env, uma senha ALEATÓRIA é gerada e logada.
app.seguranca.ambiente=${APP_AMBIENTE:desenvolvimento}
app.seguranca.admin-usuario=${APP_ADMIN_USUARIO:admin}
app.seguranca.admin-senha=${APP_ADMIN_SENHA:}
app.seguranca.bot-api-key=${BOT_API_KEY:}
app.seguranca.origens-permitidas=${APP_CORS_ORIGINS:http://localhost:5173}
